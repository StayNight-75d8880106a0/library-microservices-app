syntax = "proto3";

package book;

option go_package = "borrowing-management-services/proto/book";

service BookStockService {
  rpc GetBookStock (GetBookStockRequest) returns (GetBookStockResponse);
}

message GetBookStockRequest {
  string book_id = 1;
}

message GetBookStockResponse {
  string book_id = 1;
  int32 available_stock = 2;
  int32 total_stock = 3;
}
