services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_auth
    restart: unless-stopped
    command: ["start-dev", "--health-enabled=true", "--hostname-url=http://localhost:${KEYCLOAK_PORT_EXPOSE}"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - ${KEYCLOAK_PORT_EXPOSE}:8080 
    networks:
      - app_network
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 11
      start_period: 91s

  apache-apisix-gateway:
    image: apache/apisix:3.17.0-ubuntu
    restart: unless-stopped
    container_name: apache-apisix-gateway
    environment:
      AUTH_SERVICE_PORT: ${AUTH_APP_PORT}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
      - "9443:9443"
    networks:
      - app_network
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/7085;
          printf 'GET /status/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
      start_interval: 3s
    depends_on:
      - auth-service

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT_EXPOSE}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT_EXPOSE}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 11s
      timeout: 11s
      retries: 12
      start_period: 31s
      start_interval: 3s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT_EXPOSE}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app_network
    
  redis-cache:
    image: redis:8.6.4
    container_name: library-app-redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE}:${REDIS_PORT}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASES: ${REDIS_DB}
      REDIS_HOST: ${REDIS_HOST}
    networks:
      - app_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 11s
      timeout: 6s
      retries: 7

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT_EXPOSE}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"]
      interval: 31s
      timeout: 11s
      retries: 5
      start_period: 61s
  
  auth-service:
    build: 
      context: ./services/auth-services
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    ports:
      - ${AUTH_APP_PORT}:${AUTH_APP_PORT}
    env_file:
      - .env.shared
      - ./services/auth-services/.env.docker
    depends_on:
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app_network

  user-management-service:
    build: 
      context: ./services/user-management-services
      dockerfile: Dockerfile
    image: user-management-service:latest
    container_name: user-management-service
    restart: unless-stopped
    ports:
      - ${USER_MANAGEMENT_PORT}:${USER_MANAGEMENT_PORT}
      - ${USER_MANAGEMENT_GRPC_PORT}:${USER_MANAGEMENT_GRPC_PORT}
    env_file:
      - .env.shared
      - ./services/user-management-services/.env.docker
    depends_on:
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-management-db:
        condition: service_healthy
    networks:
      - app_network

  user-management-db:
    image: postgres:15
    container_name: user-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${userManagement_DB_NAME}
      POSTGRES_USER: ${userManagement_DB_USER}
      POSTGRES_PASSWORD: ${userManagement_DB_PASSWORD}
    ports:
      - "${userManagement_DB_PORT_EXPOSE}:${DB_PORT_GLOBAL}"
    volumes:
      - db_data_user_management:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${userManagement_DB_USER} -d ${userManagement_DB_NAME}"]
      interval: 11s
      timeout: 6s
      retries: 7

  book-management-db:
    image: mysql:9.5.0
    container_name: book-management-db
    restart: unless-stopped
    ports:
      - "${bookManagement_MYSQL_PORT_EXPOSE}:${MYSQL_PORT_GLOBAL}"
    environment:
      MYSQL_USER: ${bookManagement_MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${bookManagement_MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${bookManagement_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${bookManagement_MYSQL_DATABASE}
      MYSQL_CHARSET: ${bookManagement_MYSQL_CHARSET}
      MYSQL_COLLATION: ${bookManagement_MYSQL_COLLATION}
    volumes:
      - book_management_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${bookManagement_MYSQL_ROOT_PASSWORD}"]
      interval: 11s
      timeout: 5s
      retries: 5
      start_period: 31s

  book-management-service:
    build: 
      context: ./services/book-management-services
      dockerfile: Dockerfile
    image: book-management-service:latest
    container_name: book-management-service
    restart: unless-stopped
    ports:
      - ${BOOK_MANAGEMENT_PORT}:${BOOK_MANAGEMENT_PORT}
    env_file:
      - .env.shared
      - ./services/book-management-services/.env.docker
    depends_on:
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      book-management-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - app_network

  borrowing-management-db:
    image: mysql:9.5.0
    container_name: borrowing-management-db
    restart: unless-stopped
    ports:
      - "${borrowingManagement_MYSQL_PORT_EXPOSE}:${MYSQL_PORT_GLOBAL}"
    environment:
      MYSQL_USER: ${borrowingManagement_MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${borrowingManagement_MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${borrowingManagement_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${borrowingManagement_MYSQL_DATABASE}
      MYSQL_CHARSET: ${borrowingManagement_MYSQL_CHARSET}
      MYSQL_COLLATION: ${borrowingManagement_MYSQL_COLLATION}
    volumes:
      - borrowing_management_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${borrowingManagement_MYSQL_ROOT_PASSWORD}"]
      interval: 11s
      timeout: 5s
      retries: 5
      start_period: 31s

  borrowing-management-service:
    build: 
      context: ./services/borrowing-management-services
      dockerfile: Dockerfile
    image: borrowing-management-service:latest
    container_name: borrowing-management-service
    restart: unless-stopped
    ports:
      - ${BORROWING_MANAGEMENT_PORT}:${BORROWING_MANAGEMENT_PORT}
    env_file:
      - .env.shared
      - ./services/borrowing-management-services/.env.docker
    depends_on:
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      borrowing-management-db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  keycloak_data:
    driver: local
  kafka_data:
    driver: local
  db_data_user_management:
    driver: local
  book_management_data:
    driver: local
  es_data:
    driver: local
  borrowing_management_data:
    driver: local

networks:
  app_network:
    driver: bridge