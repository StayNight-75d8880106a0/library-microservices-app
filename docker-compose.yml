services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_auth
    restart: unless-stopped
    command: ["start-dev", "--health-enabled=true", "--hostname-url=http://localhost:${KEYCLOAK_PORT_EXPOSE}"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - ${KEYCLOAK_PORT_EXPOSE}:8080 
    networks:
      - app_network
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 11
      start_period: 91s

  apache-apisix-gateway:
    image: apache/apisix:3.17.0-ubuntu
    restart: unless-stopped
    container_name: apache-apisix-gateway
    environment:
      AUTH_SERVICE_PORT: ${AUTH_APP_PORT}
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
      - "9443:9443"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7085/status"]
      interval: 31s
      timeout: 11s
      retries: 3
      start_period: 41s
    depends_on:
      - auth-service

  redis:
    image: redis:8.6.4
    container_name: library-app-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE}:${REDIS_PORT}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASES: ${REDIS_DB}
      REDIS_HOST: ${REDIS_HOST}
    networks:
      - app_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 11s
      timeout: 6s
      retries: 7
  
  auth-service:
    build: 
      context: ./services/auth-services
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    ports:
      - ${AUTH_APP_PORT}:${AUTH_APP_PORT}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app_network

volumes:
  keycloak_data:
  
networks:
  app_network:
    driver: bridge