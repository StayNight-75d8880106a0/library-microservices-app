services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_auth
    restart: unless-stopped
    command: ["start-dev", "--health-enabled=true", "--hostname-url=http://localhost:${KEYCLOAK_PORT_EXPOSE}"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - ${KEYCLOAK_PORT_EXPOSE}:8080 
    networks:
      - auth_network
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 11
      start_period: 91s

  auth-redis:
    image: redis:8.6.4
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - "${AUTH_REDIS_PORT_EXPOSE}:${AUTH_REDIS_PORT}"
    environment:
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD}
      REDIS_DATABASES: ${AUTH_REDIS_DB}
      REDIS_HOST: ${AUTH_REDIS_HOST}
    networks:
      - auth_network
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTH_REDIS_PASSWORD}", "ping"]
      interval: 11s
      timeout: 6s
      retries: 7
  
  auth-service:
    build: 
      context: ./services/auth-services
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    ports:
      - ${AUTH_APP_PORT}:${AUTH_APP_PORT}
    env_file:
      - .env
    depends_on:
      auth-redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - auth_network

volumes:
  keycloak_data:
  
networks:
  auth_network:
    driver: bridge