global_rules:
  - id: global-cors
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "*"
        allow_headers: "Authorization,Content-Type,Accept,Origin,X-Requested-With"
        max_age: 3600
  - id: standard-too-many-request-response
    plugins:
      response-rewrite:
        vars:
          - ["status", "==", 429]
        headers:
          set:
            Content-Type: "application/json; charset=utf-8"
            Retry-After: "$sent_http_x_ratelimit_reset"
        body: '{"responseCode":429,"responseMessage":"Too many requests!","data":null,"error":{"detail":"Exceeding the prescribed request limit necessitates a momentary deferral before reinitiation! Please try again later!"},"pagination":null}'
  - id: global-rate-limit
    plugins:
      limit-count:
        count: 300
        time_window: 61
        key_type: "var_combination"
        key: "$remote_addr $http_authorization"
        rejected_code: 429
        show_limit_quota_header: true
  - id: global-prometheus
    plugins:
      prometheus: {}
  - id: system-capacity-guard
    plugins:
      limit-count:
        count: 20000
        time_window: 60
        key_type: "constant"
        key: "system-wide"
        rejected_code: 503
        policy: local
        show_limit_quota_header: false

routes:
#Layer 2
  - id: auth-login-route
    uri: /api/v1/auth/login
    priority: 100
    methods: ["POST" , "OPTIONS"]
    plugins:
      limit-count:
        count: 5
        time_window: 61
        key_type: "var"
        key: "remote_addr"
        rejected_code: 429
    upstream:
      type: roundrobin
      nodes:
        "auth-service:9091": 1
